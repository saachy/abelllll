<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abell - Good Vibes Only</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Bintang -->
    <div class="stars"></div>

    <!-- Opening -->
    <section class="opening">
        <p class="small-text">A NEW CHAPTER</p>

        <h1>Welcome To My World</h1>

        <p class="sub-opening">
            Small steps ✦ Big dreams
        </p>

        <button onclick="enterWebsite()">
            ENTER ✦
        </button>
    </section>


    <!-- Website utama -->
    <main class="main-content" id="mainContent">

        <!-- Bunga Lily -->
        <div class="lily-container"></div>

        <!-- Kelopak -->
        <div class="petals"></div>

        <!-- Foto -->
        <div class="photo-container">

            <div class="glow"></div>

            <div class="photo-frame">

                <!-- GANTI FOTO DI SINI -->
                <img src="foto-abell.jpg" alt="Foto Abell">

            </div>

        </div>


        <!-- Tulisan -->
        <div class="text-content">

            <p class="welcome">
                ✦ Welcome ✦
            </p>

            <h2>Abell</h2>

            <p class="caption">
                GOOD VIBES ONLY
            </p>

            <div class="line"></div>

            <p class="quote">
                Keep shining, keep smiling.
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
